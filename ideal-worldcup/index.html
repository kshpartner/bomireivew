<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이상형 월드컵</title>
  <meta name="description" content="이미지 폴더와 JSON 목록으로 진행하는 이상형 월드컵 샘플 페이지">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    *{box-sizing:border-box}
    body{margin:0;font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;color:#292724;background:#f6f2ea;letter-spacing:0}
    button{font:inherit}
    .topbar{position:sticky;top:0;z-index:5;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(246,242,234,.92);border-bottom:1px solid #ded5c6;backdrop-filter:blur(12px)}
    .brand{font-size:22px;font-weight:900;color:#9c4f3b;text-decoration:none}
    .topbar a:not(.brand){color:#625a50;text-decoration:none;font-weight:750}
    main{max-width:1160px;margin:0 auto;padding:30px 20px 60px}
    .intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}
    .eyebrow{margin:0 0 8px;color:#b76046;font-size:13px;font-weight:900;text-transform:uppercase}
    h1{margin:0;color:#2f2a25;font-size:42px;line-height:1.18}
    .summary{max-width:620px;margin:12px 0 0;color:#6e655b;font-size:17px;line-height:1.7}
    .status{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
    .chip{min-height:34px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #dccfbd;border-radius:999px;background:#fffaf3;color:#655b50;font-size:14px;font-weight:800}
    .arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch}
    .candidate{min-height:510px;display:flex;flex-direction:column;padding:0;border:1px solid #dccfbd;border-radius:8px;background:#fffaf3;box-shadow:0 16px 34px rgba(70,54,38,.1);overflow:hidden;cursor:pointer;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
    .candidate:hover,.candidate:focus-visible{transform:translateY(-3px);border-color:#c98265;box-shadow:0 22px 42px rgba(70,54,38,.15);outline:none}
    .photo{flex:1;min-height:390px;background:#e8dfd2}
    .photo img{display:block;width:100%;height:100%;object-fit:cover}
    .candidate strong{display:flex;align-items:center;justify-content:center;min-height:74px;padding:16px 18px;color:#312b25;font-size:22px;line-height:1.35;text-align:center}
    .versus{position:relative;display:grid;place-items:center;height:0}
    .versus span{position:absolute;z-index:2;top:235px;display:grid;place-items:center;width:66px;height:66px;border-radius:50%;background:#2f2a25;color:#fff;font-size:20px;font-weight:950;box-shadow:0 16px 32px rgba(47,42,37,.28)}
    .actions{display:flex;justify-content:center;gap:10px;margin-top:18px}
    .action{min-height:44px;padding:0 16px;border:1px solid #d9c7b4;border-radius:8px;background:#fffaf3;color:#554c43;font-weight:850;cursor:pointer}
    .action.primary{background:#b85f45;color:#fff;border-color:#b85f45}
    .action:hover{filter:brightness(.98)}
    .result{display:none;max-width:720px;margin:22px auto 0;border:1px solid #dccfbd;border-radius:8px;background:#fffaf3;box-shadow:0 16px 34px rgba(70,54,38,.1);overflow:hidden;text-align:center}
    .result img{display:block;width:100%;max-height:560px;object-fit:cover;background:#e8dfd2}
    .result-body{padding:24px}
    .result-body p{margin:0;color:#b76046;font-size:14px;font-weight:900}
    .result-body h2{margin:8px 0 0;color:#2f2a25;font-size:34px;line-height:1.22}
    .empty{display:none;margin-top:22px;padding:24px;border:1px solid #dccfbd;border-radius:8px;background:#fffaf3;color:#6e655b;text-align:center;font-weight:800}
    @media(max-width:760px){
      .topbar{padding:0 18px}
      main{padding:24px 14px 46px}
      .intro{display:block}
      h1{font-size:32px}
      .summary{font-size:16px}
      .status{justify-content:flex-start;margin-top:16px}
      .arena{grid-template-columns:1fr;gap:14px}
      .candidate{min-height:auto}
      .photo{min-height:270px}
      .candidate strong{font-size:19px}
      .versus{display:none}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">이상형 월드컵</a>
    <a href="../index.html">블로그 홈</a>
  </header>

  <main>
    <section class="intro">
      <div>
        <p class="eyebrow">Pick Your Favorite</p>
        <h1>둘 중 하나를 고르면<br>결승까지 자동 진행됩니다</h1>
        <p class="summary">이 샘플은 같은 폴더의 <strong>worldcup.json</strong>을 읽어서 작동합니다. 나중에 C# 업로드 기능이 이미지와 JSON만 갱신하면 페이지는 그대로 사용할 수 있습니다.</p>
      </div>
      <div class="status">
        <span class="chip" id="roundLabel">준비 중</span>
        <span class="chip" id="matchLabel">0 / 0</span>
      </div>
    </section>

    <section class="arena" id="arena" aria-live="polite">
      <button class="candidate" id="leftCard" type="button">
        <span class="photo"><img id="leftImage" alt=""></span>
        <strong id="leftTitle"></strong>
      </button>
      <div class="versus" aria-hidden="true"><span>VS</span></div>
      <button class="candidate" id="rightCard" type="button">
        <span class="photo"><img id="rightImage" alt=""></span>
        <strong id="rightTitle"></strong>
      </button>
    </section>

    <section class="result" id="result">
      <img id="winnerImage" alt="">
      <div class="result-body">
        <p>최종 우승</p>
        <h2 id="winnerTitle"></h2>
      </div>
    </section>

    <p class="empty" id="emptyMessage">월드컵을 진행하려면 worldcup.json에 이미지가 최소 2개 필요합니다.</p>

    <div class="actions">
      <button class="action" id="shuffleBtn" type="button">섞어서 다시</button>
      <button class="action primary" id="restartBtn" type="button">처음부터</button>
    </div>
  </main>

  <script>
    const state = {
      sourceItems: [],
      roundItems: [],
      winners: [],
      matchIndex: 0,
      left: null,
      right: null
    };

    const $ = (id) => document.getElementById(id);

    function shuffle(items) {
      const copied = [...items];
      for (let i = copied.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }
      return copied;
    }

    function trimToPowerOfTwo(items) {
      const sizes = [64, 32, 16, 8, 4, 2];
      const size = sizes.find((value) => items.length >= value) || 0;
      return items.slice(0, size);
    }

    function getRoundName(count) {
      if (count === 2) return '결승';
      if (count === 4) return '4강';
      if (count === 8) return '8강';
      return `${count}강`;
    }

    function normalizeItem(item, index) {
      return {
        id: item.id || `item-${index + 1}`,
        title: item.title || `후보 ${index + 1}`,
        imageUrl: item.imageUrl || item.url || ''
      };
    }

    async function loadItems() {
      const response = await fetch('worldcup.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('worldcup.json을 불러오지 못했습니다.');
      const items = await response.json();
      state.sourceItems = items.map(normalizeItem).filter((item) => item.imageUrl);
    }

    function startGame(shouldShuffle) {
      const items = shouldShuffle ? shuffle(state.sourceItems) : [...state.sourceItems];
      state.roundItems = trimToPowerOfTwo(items);
      state.winners = [];
      state.matchIndex = 0;
      $('result').style.display = 'none';
      $('arena').style.display = state.roundItems.length >= 2 ? 'grid' : 'none';
      $('emptyMessage').style.display = state.roundItems.length >= 2 ? 'none' : 'block';
      if (state.roundItems.length >= 2) renderMatch();
    }

    function renderMatch() {
      state.left = state.roundItems[state.matchIndex * 2];
      state.right = state.roundItems[state.matchIndex * 2 + 1];

      const totalMatches = state.roundItems.length / 2;
      $('roundLabel').textContent = getRoundName(state.roundItems.length);
      $('matchLabel').textContent = `${state.matchIndex + 1} / ${totalMatches}`;

      $('leftImage').src = state.left.imageUrl;
      $('leftImage').alt = state.left.title;
      $('leftTitle').textContent = state.left.title;

      $('rightImage').src = state.right.imageUrl;
      $('rightImage').alt = state.right.title;
      $('rightTitle').textContent = state.right.title;
    }

    function choose(winner) {
      state.winners.push(winner);
      state.matchIndex += 1;

      if (state.matchIndex < state.roundItems.length / 2) {
        renderMatch();
        return;
      }

      if (state.winners.length === 1) {
        showWinner(state.winners[0]);
        return;
      }

      state.roundItems = [...state.winners];
      state.winners = [];
      state.matchIndex = 0;
      renderMatch();
    }

    function showWinner(winner) {
      $('arena').style.display = 'none';
      $('roundLabel').textContent = '완료';
      $('matchLabel').textContent = '우승';
      $('winnerImage').src = winner.imageUrl;
      $('winnerImage').alt = winner.title;
      $('winnerTitle').textContent = winner.title;
      $('result').style.display = 'block';
    }

    $('leftCard').addEventListener('click', () => choose(state.left));
    $('rightCard').addEventListener('click', () => choose(state.right));
    $('restartBtn').addEventListener('click', () => startGame(false));
    $('shuffleBtn').addEventListener('click', () => startGame(true));

    loadItems()
      .then(() => startGame(true))
      .catch(() => {
        $('arena').style.display = 'none';
        $('emptyMessage').style.display = 'block';
        $('roundLabel').textContent = '오류';
        $('matchLabel').textContent = '확인 필요';
      });
  </script>
</body>
</html>
