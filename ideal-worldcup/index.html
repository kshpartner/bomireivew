<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>창섭 님의 AI포토 이상형 월드컵</title>
  <meta name="description" content="창섭 님의 AI포토 이상형 월드컵">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    *{box-sizing:border-box}
    body{margin:0;font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;color:#252326;background:#f7f4ef;letter-spacing:0}
    button{font:inherit}
    .topbar{position:sticky;top:0;z-index:5;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(247,244,239,.92);border-bottom:1px solid #ded6ca;backdrop-filter:blur(12px)}
    .brand{font-size:22px;font-weight:900;color:#26374f;text-decoration:none}
    .topbar a:not(.brand){color:#68605a;text-decoration:none;font-weight:750}
    main{max-width:1160px;margin:0 auto;padding:30px 20px 60px}
    .intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}
    .eyebrow{margin:0 0 8px;color:#b4893e;font-size:13px;font-weight:900;text-transform:uppercase}
    h1{margin:0;color:#222936;font-size:42px;line-height:1.18}
    .summary{max-width:650px;margin:12px 0 0;color:#6f675f;font-size:17px;line-height:1.7}
    .status{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
    .chip{min-height:34px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid #d9d0c3;border-radius:999px;background:#fffaf4;color:#615b55;font-size:14px;font-weight:800}
    .start-panel{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:center;margin-top:22px;padding:26px;border:1px solid #d9d0c3;border-radius:8px;background:#fffaf4;box-shadow:0 16px 34px rgba(44,52,65,.1)}
    .start-panel strong{display:block;color:#222936;font-size:24px;line-height:1.3}
    .start-panel p{margin:10px 0 0;color:#6f675f;line-height:1.65}
    .start-button{width:100%;min-height:64px;border:0;border-radius:8px;background:#26374f;color:#fff;font-size:20px;font-weight:950;cursor:pointer;box-shadow:0 16px 30px rgba(38,55,79,.22)}
    .start-button:hover{filter:brightness(1.04)}
    .arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch}
    .candidate{min-height:510px;display:flex;flex-direction:column;padding:0;border:1px solid #d9d0c3;border-radius:8px;background:#fffaf4;box-shadow:0 16px 34px rgba(44,52,65,.1);overflow:hidden;cursor:pointer;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
    .candidate:hover,.candidate:focus-visible{transform:translateY(-3px);border-color:#bfa467;box-shadow:0 22px 42px rgba(44,52,65,.16);outline:none}
    .photo{flex:1;min-height:390px;background:#e8e0d7}
    .photo img{display:block;width:100%;height:100%;object-fit:cover}
    .candidate strong{display:flex;align-items:center;justify-content:center;min-height:74px;padding:16px 18px;color:#222936;font-size:22px;line-height:1.35;text-align:center}
    .versus{position:relative;display:grid;place-items:center;height:0}
    .versus span{position:absolute;z-index:2;top:235px;display:grid;place-items:center;width:66px;height:66px;border-radius:50%;background:#222936;color:#fff;font-size:20px;font-weight:950;box-shadow:0 16px 32px rgba(34,41,54,.28)}
    .actions{display:flex;justify-content:center;gap:10px;margin-top:18px}
    .action{min-height:44px;padding:0 16px;border:1px solid #d9d0c3;border-radius:8px;background:#fffaf4;color:#554f49;font-weight:850;cursor:pointer}
    .action.primary{background:#26374f;color:#fff;border-color:#26374f}
    .action:hover{filter:brightness(.98)}
    .result{display:none;max-width:980px;margin:22px auto 0;text-align:center}
    .winner-card{border:1px solid #d9d0c3;border-radius:8px;background:#fffaf4;box-shadow:0 16px 34px rgba(44,52,65,.1);overflow:hidden}
    .winner-card img{display:block;width:100%;max-height:560px;object-fit:cover;background:#e8e0d7}
    .result-body{padding:24px}
    .result-body p{margin:0;color:#b4893e;font-size:14px;font-weight:900}
    .result-body h2{margin:8px 0 0;color:#222936;font-size:34px;line-height:1.22}
    .ranking{display:grid;grid-template-columns:1.15fr repeat(3,1fr);gap:12px;margin-top:16px}
    .rank-card{min-width:0;border:1px solid #d9d0c3;border-radius:8px;background:#fffaf4;overflow:hidden;box-shadow:0 12px 26px rgba(44,52,65,.08)}
    .rank-card.winner{border-color:#d6a846;background:#fff8dc}
    .rank-card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#e8e0d7}
    .rank-body{padding:13px}
    .rank-medal{display:inline-flex;align-items:center;justify-content:center;min-height:28px;margin-bottom:8px;padding:0 10px;border-radius:999px;background:#eee7dd;color:#5f5850;font-size:13px;font-weight:950}
    .rank-card.winner .rank-medal{background:#f6d45c;color:#45320b}
    .rank-body strong{display:block;color:#222936;font-size:16px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
    .share-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
    .copy-button{min-height:44px;padding:0 16px;border:1px solid #d9d0c3;border-radius:8px;background:#fffaf4;color:#554f49;font-weight:850;cursor:pointer}
    .empty{display:none;margin-top:22px;padding:24px;border:1px solid #d9d0c3;border-radius:8px;background:#fffaf4;color:#6f675f;text-align:center;font-weight:800}
    @media(max-width:900px){.ranking{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){
      .topbar{padding:0 18px}
      main{padding:24px 14px 46px}
      .intro{display:block}
      h1{font-size:32px}
      .summary{font-size:16px}
      .status{justify-content:flex-start;margin-top:16px}
      .start-panel{grid-template-columns:1fr;padding:18px}
      .arena{grid-template-columns:1fr;gap:14px}
      .candidate{min-height:auto}
      .photo{min-height:270px}
      .candidate strong{font-size:19px}
      .versus{display:none}
      .ranking{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">창섭 님의 AI포토 이상형 월드컵</a>
    <a href="../index.html">블로그 홈</a>
  </header>

  <main>
    <section class="intro">
      <div>
        <p class="eyebrow">AI Photo World Cup</p>
        <h1>창섭 님의 AI포토<br>이상형 월드컵</h1>
        <p class="summary">팬메이드 AI포토 중 가장 마음이 가는 한 장을 고르는 페이지입니다. 이미지 수가 딱 맞지 않아도 부전승으로 자연스럽게 진행됩니다.</p>
      </div>
      <div class="status">
        <span class="chip" id="roundLabel">준비 중</span>
        <span class="chip" id="matchLabel">0 / 0</span>
      </div>
    </section>

    <section class="start-panel" id="startPanel">
      <div>
        <strong>준비되면 시작해 주세요</strong>
        <p>두 장씩 비교하면서 마지막 한 장까지 고르는 방식입니다. 후보 수가 맞지 않는 라운드는 자동으로 부전승 처리됩니다.</p>
      </div>
      <button class="start-button" id="startBtn" type="button">시작하기</button>
    </section>

    <section class="arena" id="arena" aria-live="polite">
      <button class="candidate" id="leftCard" type="button">
        <span class="photo"><img id="leftImage" alt=""></span>
        <strong id="leftTitle"></strong>
      </button>
      <div class="versus" aria-hidden="true"><span>VS</span></div>
      <button class="candidate" id="rightCard" type="button">
        <span class="photo"><img id="rightImage" alt=""></span>
        <strong id="rightTitle"></strong>
      </button>
    </section>

    <section class="result" id="result">
      <div class="winner-card">
        <img id="winnerImage" alt="">
        <div class="result-body">
          <p>오늘의 원픽</p>
          <h2 id="winnerTitle"></h2>
          <div class="share-actions">
            <button class="copy-button" id="copyResultBtn" type="button">결과 링크 복사</button>
          </div>
        </div>
      </div>
      <div class="ranking" id="rankingList"></div>
    </section>

    <p class="empty" id="emptyMessage">후보 이미지가 최소 2장 필요합니다.</p>

    <div class="actions">
      <button class="action" id="shuffleBtn" type="button">섞어서 다시</button>
      <button class="action primary" id="restartBtn" type="button">처음부터</button>
    </div>
  </main>

  <script>
    const state = {
      sourceItems: [],
      roundSize: 0,
      currentMatches: [],
      nextRoundItems: [],
      matchIndex: 0,
      left: null,
      right: null,
      winner: null,
      finalLoser: null,
      semifinalLosers: []
    };

    const $ = (id) => document.getElementById(id);

    function shuffle(items) {
      const copied = [...items];
      for (let i = copied.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }
      return copied;
    }

    function getBracketSize(count) {
      let size = 2;
      while (size < count) size *= 2;
      return size;
    }

    function getRoundName(count) {
      if (count === 2) return '파이널';
      if (count === 4) return '세미파이널';
      return `${count}강`;
    }

    function normalizeItem(item, index) {
      return {
        id: item.id || `item-${index + 1}`,
        title: item.title || `창섭 픽 후보 ${index + 1}`,
        imageUrl: item.imageUrl || item.url || ''
      };
    }

    async function loadItems() {
      const response = await fetch('worldcup.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('후보 목록을 불러오지 못했습니다.');
      const items = await response.json();
      state.sourceItems = items.map(normalizeItem).filter((item) => item.imageUrl);
    }

    function buildRoundMatches(items, roundSize) {
      const shuffled = shuffle(items);
      const byeCount = Math.max(0, roundSize - shuffled.length);
      const matches = [];
      let index = 0;

      for (let i = 0; i < byeCount; i += 1) {
        matches.push([shuffled[index], null]);
        index += 1;
      }

      while (index < shuffled.length) {
        matches.push([shuffled[index], shuffled[index + 1] || null]);
        index += 2;
      }

      return shuffle(matches);
    }

    function resetGameState() {
      state.roundSize = getBracketSize(state.sourceItems.length);
      state.currentMatches = buildRoundMatches(state.sourceItems, state.roundSize);
      state.nextRoundItems = [];
      state.matchIndex = 0;
      state.winner = null;
      state.finalLoser = null;
      state.semifinalLosers = [];
    }

    function startGame() {
      resetGameState();

      $('startPanel').style.display = 'none';
      $('result').style.display = 'none';
      $('arena').style.display = state.sourceItems.length >= 2 ? 'grid' : 'none';
      $('emptyMessage').style.display = state.sourceItems.length >= 2 ? 'none' : 'block';

      if (state.sourceItems.length >= 2) renderNextPlayableMatch();
    }

    function renderNextPlayableMatch() {
      while (state.matchIndex < state.currentMatches.length) {
        const [left, right] = state.currentMatches[state.matchIndex];

        if (left && !right) {
          state.nextRoundItems.push(left);
          state.matchIndex += 1;
          continue;
        }

        if (!left && right) {
          state.nextRoundItems.push(right);
          state.matchIndex += 1;
          continue;
        }

        state.left = left;
        state.right = right;
        renderMatch();
        return;
      }

      finishRound();
    }

    function renderMatch() {
      const playableTotal = state.currentMatches.filter(([left, right]) => left && right).length;
      const playableDone = state.currentMatches.slice(0, state.matchIndex).filter(([left, right]) => left && right).length;
      const byeTotal = state.currentMatches.length - playableTotal;
      const suffix = byeTotal > 0 ? ` · 부전승 ${byeTotal}` : '';

      $('roundLabel').textContent = getRoundName(state.roundSize);
      $('matchLabel').textContent = `${playableDone + 1} / ${playableTotal}${suffix}`;

      $('leftImage').src = state.left.imageUrl;
      $('leftImage').alt = state.left.title;
      $('leftTitle').textContent = state.left.title;

      $('rightImage').src = state.right.imageUrl;
      $('rightImage').alt = state.right.title;
      $('rightTitle').textContent = state.right.title;
    }

    function choose(winner) {
      const loser = winner.id === state.left.id ? state.right : state.left;
      if (state.roundSize === 2) state.finalLoser = loser;
      if (state.roundSize === 4) state.semifinalLosers.push(loser);

      state.nextRoundItems.push(winner);
      state.matchIndex += 1;
      renderNextPlayableMatch();
    }

    function finishRound() {
      if (state.nextRoundItems.length === 1) {
        showWinner(state.nextRoundItems[0]);
        return;
      }

      state.roundSize = state.nextRoundItems.length;
      state.currentMatches = buildRoundMatches(state.nextRoundItems, state.roundSize);
      state.nextRoundItems = [];
      state.matchIndex = 0;
      renderNextPlayableMatch();
    }

    function showWinner(winner) {
      state.winner = winner;
      $('arena').style.display = 'none';
      $('roundLabel').textContent = '완료';
      $('matchLabel').textContent = '원픽';
      $('winnerImage').src = winner.imageUrl;
      $('winnerImage').alt = winner.title;
      $('winnerTitle').textContent = winner.title;
      renderRanking();
      $('result').style.display = 'block';
    }

    function renderRanking() {
      const ranks = [
        { rank: 1, medal: '왕관', item: state.winner, className: 'winner' },
        { rank: 2, medal: '골드', item: state.finalLoser },
        { rank: 3, medal: '실버', item: state.semifinalLosers[0] },
        { rank: 4, medal: '브론즈', item: state.semifinalLosers[1] }
      ].filter((entry) => entry.item);

      $('rankingList').innerHTML = ranks.map((entry) => `
        <article class="rank-card ${entry.className || ''}">
          <img src="${escapeHtml(entry.item.imageUrl)}" alt="${escapeHtml(entry.item.title)}">
          <div class="rank-body">
            <span class="rank-medal">${entry.rank}위 · ${entry.medal}</span>
            <strong>${escapeHtml(entry.item.title)}</strong>
          </div>
        </article>
      `).join('');
    }

    function getResultUrl() {
      const url = new URL(window.location.href);
      if (state.winner?.id) url.searchParams.set('winner', state.winner.id);
      return url.href;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function copyResultLink() {
      const lines = [
        `창섭 님의 오늘의 원픽`,
        `1위 왕관: ${state.winner?.title || ''}`,
        state.finalLoser ? `2위 골드: ${state.finalLoser.title}` : '',
        state.semifinalLosers[0] ? `3위 실버: ${state.semifinalLosers[0].title}` : '',
        state.semifinalLosers[1] ? `4위 브론즈: ${state.semifinalLosers[1].title}` : '',
        getResultUrl()
      ].filter(Boolean);

      try {
        await navigator.clipboard.writeText(lines.join('\n'));
        $('copyResultBtn').textContent = '복사 완료';
        setTimeout(() => $('copyResultBtn').textContent = '결과 링크 복사', 1500);
      } catch {
        window.prompt('아래 결과 링크를 복사하세요.', lines.join('\n'));
      }
    }

    $('leftCard').addEventListener('click', () => choose(state.left));
    $('rightCard').addEventListener('click', () => choose(state.right));
    $('restartBtn').addEventListener('click', startGame);
    $('shuffleBtn').addEventListener('click', startGame);
    $('startBtn').addEventListener('click', startGame);
    $('copyResultBtn').addEventListener('click', copyResultLink);

    loadItems()
      .then(() => {
        $('arena').style.display = 'none';
        $('result').style.display = 'none';
        $('emptyMessage').style.display = state.sourceItems.length >= 2 ? 'none' : 'block';
        $('startPanel').style.display = state.sourceItems.length >= 2 ? 'grid' : 'none';
        $('roundLabel').textContent = state.sourceItems.length >= 2 ? `${getBracketSize(state.sourceItems.length)}강` : '대기';
        $('matchLabel').textContent = `${state.sourceItems.length}장`;
      })
      .catch(() => {
        $('arena').style.display = 'none';
        $('startPanel').style.display = 'none';
        $('emptyMessage').style.display = 'block';
        $('roundLabel').textContent = '오류';
        $('matchLabel').textContent = '확인 필요';
      });
  </script>
</body>
</html>
