<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>창섭 님의 AI포토 이상형 월드컵</title>
  <meta name="description" content="창섭 님의 AI포토 이상형 월드컵">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
    :root{--ink:#202633;--muted:#6e665d;--paper:#fffaf3;--line:#ded2c3;--navy:#24344f;--gold:#c99a3d;--rose:#f1ddd2;--mint:#dceade}
    *{box-sizing:border-box}
    html{min-height:100%}
    body{min-height:100%;margin:0;font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;color:var(--ink);background:linear-gradient(135deg,#fbf5ec 0%,#f4eee7 42%,#eef4ef 100%);letter-spacing:0;overflow-x:hidden}
    button{font:inherit}
    .topbar{position:sticky;top:0;z-index:5;height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;background:rgba(255,250,243,.86);border-bottom:1px solid rgba(222,210,195,.84);backdrop-filter:blur(16px)}
    .brand{min-width:0;color:var(--navy);font-size:20px;font-weight:950;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topbar a:not(.brand){flex:0 0 auto;color:var(--muted);text-decoration:none;font-size:14px;font-weight:850}
    main{max-width:1180px;min-height:calc(100svh - 58px);margin:0 auto;padding:18px 18px 28px}
    .intro{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}
    .eyebrow{margin:0 0 6px;color:var(--gold);font-size:12px;font-weight:950;text-transform:uppercase}
    h1{margin:0;color:var(--ink);font-size:36px;line-height:1.15}
    .summary{max-width:650px;margin:12px 0 0;color:var(--muted);font-size:17px;line-height:1.7}
    .status{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .chip{min-height:32px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid rgba(222,210,195,.9);border-radius:999px;background:rgba(255,250,243,.76);color:#5f5a53;font-size:13px;font-weight:900;box-shadow:0 8px 18px rgba(47,50,61,.06)}
    .start-panel{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:center;margin-top:14px;padding:24px;border:1px solid rgba(222,210,195,.95);border-radius:8px;background:rgba(255,250,243,.9);box-shadow:0 22px 48px rgba(41,47,60,.13)}
    .start-panel strong{display:block;color:var(--ink);font-size:24px;line-height:1.3}
    .start-panel p{margin:10px 0 0;color:var(--muted);line-height:1.65}
    .start-button{width:100%;min-height:62px;border:0;border-radius:8px;background:linear-gradient(135deg,var(--navy),#405d82);color:#fff;font-size:20px;font-weight:950;cursor:pointer;box-shadow:0 16px 30px rgba(36,52,79,.24)}
    .start-button:hover{filter:brightness(1.04)}
    .arena{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
    .candidate{position:relative;min-height:calc(100svh - 198px);display:flex;flex-direction:column;padding:0;border:1px solid rgba(222,210,195,.95);border-radius:8px;background:var(--paper);box-shadow:0 20px 46px rgba(41,47,60,.15);overflow:hidden;cursor:pointer;isolation:isolate;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
    .candidate:hover,.candidate:focus-visible{transform:translateY(-3px);border-color:#c5a15f;box-shadow:0 26px 56px rgba(41,47,60,.2);outline:none}
    .candidate:active{transform:scale(.992)}
    .photo{position:absolute;inset:0;background:#e7ddd3}
    .photo::after{content:"";position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(0deg,rgba(19,23,31,.74),rgba(19,23,31,0));pointer-events:none}
    .photo img{display:block;width:100%;height:100%;object-fit:cover}
    .candidate strong{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:center;min-height:100%;padding:18px;color:#fff;font-size:22px;line-height:1.3;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.44);word-break:keep-all;overflow-wrap:anywhere}
    .versus{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
    .versus span{z-index:2;display:grid;place-items:center;width:60px;height:60px;border:1px solid rgba(255,255,255,.32);border-radius:50%;background:rgba(32,38,51,.92);color:#fff;font-size:18px;font-weight:950;box-shadow:0 18px 34px rgba(34,41,54,.32)}
    .actions{display:flex;justify-content:center;gap:9px;margin-top:12px}
    .action{min-height:42px;padding:0 15px;border:1px solid rgba(222,210,195,.95);border-radius:8px;background:rgba(255,250,243,.84);color:#554f49;font-weight:900;cursor:pointer;box-shadow:0 10px 20px rgba(41,47,60,.07)}
    .action.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
    .action:hover{filter:brightness(.98)}
    .result{display:none;max-width:980px;margin:14px auto 0;text-align:center}
    .winner-card{border:1px solid rgba(222,210,195,.95);border-radius:8px;background:rgba(255,250,243,.92);box-shadow:0 22px 48px rgba(41,47,60,.13);overflow:hidden}
    .winner-card img{display:block;width:100%;max-height:520px;object-fit:cover;background:#e8e0d7}
    .result-body{padding:22px}
    .result-body p{margin:0;color:var(--gold);font-size:14px;font-weight:950}
    .result-body h2{margin:8px 0 0;color:var(--ink);font-size:32px;line-height:1.22}
    .ranking{display:grid;grid-template-columns:1.15fr repeat(3,1fr);gap:12px;margin-top:14px}
    .rank-card{min-width:0;border:1px solid rgba(222,210,195,.95);border-radius:8px;background:rgba(255,250,243,.9);overflow:hidden;box-shadow:0 12px 26px rgba(44,52,65,.08)}
    .rank-card.winner{border-color:#d6a846;background:#fff8dc}
    .rank-card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#e8e0d7}
    .rank-body{padding:12px}
    .rank-medal{display:inline-flex;align-items:center;justify-content:center;min-height:27px;margin-bottom:8px;padding:0 10px;border-radius:999px;background:#eee7dd;color:#5f5850;font-size:13px;font-weight:950}
    .rank-card.winner .rank-medal{background:#f6d45c;color:#45320b}
    .rank-body strong{display:block;color:var(--ink);font-size:16px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
    .share-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
    .copy-button{min-height:42px;padding:0 16px;border:1px solid rgba(222,210,195,.95);border-radius:8px;background:var(--paper);color:#554f49;font-weight:900;cursor:pointer}
    .empty{display:none;margin-top:16px;padding:24px;border:1px solid rgba(222,210,195,.95);border-radius:8px;background:rgba(255,250,243,.9);color:var(--muted);text-align:center;font-weight:900}
    @media(max-width:900px){.ranking{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){
      .topbar{height:48px;padding:0 12px}
      .brand{font-size:15px}
      .topbar a:not(.brand){font-size:12px}
      main{min-height:calc(100svh - 48px);padding:10px 10px 12px}
      .intro{align-items:center;margin-bottom:8px}
      .eyebrow{display:none}
      h1{font-size:22px;line-height:1.14}
      .summary{font-size:16px}
      .status{gap:6px;justify-content:flex-end}
      .chip{min-height:28px;padding:0 9px;font-size:12px}
      .start-panel{grid-template-columns:1fr;gap:14px;margin-top:8px;padding:16px}
      .start-panel strong{font-size:22px}
      .start-button{min-height:58px;font-size:19px}
      .arena{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:8px;height:calc(100svh - 174px);min-height:0}
      .candidate{min-height:0;border-radius:8px;box-shadow:0 12px 26px rgba(41,47,60,.14)}
      .candidate:hover,.candidate:focus-visible{transform:none}
      .candidate strong{padding:12px 14px;font-size:15px;line-height:1.28}
      .photo::after{height:52%}
      .versus span{width:44px;height:44px;font-size:13px;box-shadow:0 10px 22px rgba(34,41,54,.26)}
      .actions{margin-top:8px}
      .action{flex:1;min-height:36px;padding:0 10px;font-size:13px}
      .result{margin-top:8px}
      .winner-card img{max-height:44svh}
      .result-body{padding:16px}
      .result-body h2{font-size:24px}
      .ranking{grid-template-columns:repeat(2,1fr);gap:8px}
      .rank-body{padding:10px}
      .rank-medal{font-size:12px}
      .rank-body strong{font-size:14px}
    }
    @media(max-width:380px){
      h1{font-size:20px}
      .chip{font-size:11px}
      .arena{height:calc(100svh - 166px)}
      .candidate strong{font-size:14px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">창섭 님의 AI포토 이상형 월드컵</a>
    <a href="../index.html">블로그 홈</a>
  </header>

  <main>
    <section class="intro">
      <div>
        <p class="eyebrow">AI Photo World Cup</p>
        <h1>창섭 님의 AI포토<br>이상형 월드컵</h1>
      </div>
      <div class="status">
        <span class="chip" id="roundLabel">준비 중</span>
        <span class="chip" id="matchLabel">0 / 0</span>
      </div>
    </section>

    <section class="start-panel" id="startPanel">
      <div>
        <strong>준비되면 시작해 주세요</strong>
      </div>
      <button class="start-button" id="startBtn" type="button">시작하기</button>
    </section>

    <section class="arena" id="arena" aria-live="polite">
      <button class="candidate" id="leftCard" type="button">
        <span class="photo"><img id="leftImage" alt=""></span>
        <strong id="leftTitle"></strong>
      </button>
      <div class="versus" aria-hidden="true"><span>VS</span></div>
      <button class="candidate" id="rightCard" type="button">
        <span class="photo"><img id="rightImage" alt=""></span>
        <strong id="rightTitle"></strong>
      </button>
    </section>

    <section class="result" id="result">
      <div class="winner-card">
        <img id="winnerImage" alt="">
        <div class="result-body">
          <p>오늘의 원픽</p>
          <h2 id="winnerTitle"></h2>
          <div class="share-actions">
            <button class="copy-button" id="copyResultBtn" type="button">결과 링크 복사</button>
          </div>
        </div>
      </div>
      <div class="ranking" id="rankingList"></div>
    </section>

    <p class="empty" id="emptyMessage">후보 이미지가 최소 2장 필요합니다.</p>

    <div class="actions">
      <button class="action" id="shuffleBtn" type="button">섞어서 다시</button>
      <button class="action primary" id="restartBtn" type="button">처음부터</button>
    </div>
  </main>

  <script>
    const state = {
      sourceItems: [],
      roundSize: 0,
      currentMatches: [],
      nextRoundItems: [],
      matchIndex: 0,
      left: null,
      right: null,
      winner: null,
      finalLoser: null,
      semifinalLosers: []
    };

    const $ = (id) => document.getElementById(id);

    function shuffle(items) {
      const copied = [...items];
      for (let i = copied.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }
      return copied;
    }

    function getBracketSize(count) {
      let size = 2;
      while (size < count) size *= 2;
      return size;
    }

    function getRoundName(count) {
      if (count === 2) return '파이널';
      if (count === 4) return '세미파이널';
      return `${count}강`;
    }

    function normalizeItem(item, index) {
      return {
        id: item.id || `item-${index + 1}`,
        title: item.title || `창섭 픽 후보 ${index + 1}`,
        imageUrl: item.imageUrl || item.url || ''
      };
    }

    async function loadItems() {
      const response = await fetch('worldcup-v2.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('후보 목록을 불러오지 못했습니다.');
      const items = await response.json();
      state.sourceItems = items.map(normalizeItem).filter((item) => item.imageUrl);
    }

    function buildRoundMatches(items, roundSize) {
      const shuffled = shuffle(items);
      const byeCount = Math.max(0, roundSize - shuffled.length);
      const matches = [];
      let index = 0;

      for (let i = 0; i < byeCount; i += 1) {
        matches.push([shuffled[index], null]);
        index += 1;
      }

      while (index < shuffled.length) {
        matches.push([shuffled[index], shuffled[index + 1] || null]);
        index += 2;
      }

      return shuffle(matches);
    }

    function resetGameState() {
      state.roundSize = getBracketSize(state.sourceItems.length);
      state.currentMatches = buildRoundMatches(state.sourceItems, state.roundSize);
      state.nextRoundItems = [];
      state.matchIndex = 0;
      state.winner = null;
      state.finalLoser = null;
      state.semifinalLosers = [];
    }

    function startGame() {
      resetGameState();

      $('startPanel').style.display = 'none';
      $('result').style.display = 'none';
      $('arena').style.display = state.sourceItems.length >= 2 ? 'grid' : 'none';
      $('emptyMessage').style.display = state.sourceItems.length >= 2 ? 'none' : 'block';

      if (state.sourceItems.length >= 2) renderNextPlayableMatch();
    }

    function renderNextPlayableMatch() {
      while (state.matchIndex < state.currentMatches.length) {
        const [left, right] = state.currentMatches[state.matchIndex];

        if (left && !right) {
          state.nextRoundItems.push(left);
          state.matchIndex += 1;
          continue;
        }

        if (!left && right) {
          state.nextRoundItems.push(right);
          state.matchIndex += 1;
          continue;
        }

        state.left = left;
        state.right = right;
        renderMatch();
        return;
      }

      finishRound();
    }

    function renderMatch() {
      const playableTotal = state.currentMatches.filter(([left, right]) => left && right).length;
      const playableDone = state.currentMatches.slice(0, state.matchIndex).filter(([left, right]) => left && right).length;
      const suffix = '';

      $('roundLabel').textContent = getRoundName(state.roundSize);
      $('matchLabel').textContent = `${playableDone + 1} / ${playableTotal}${suffix}`;

      $('leftImage').src = state.left.imageUrl;
      $('leftImage').alt = state.left.title;
      $('leftTitle').textContent = state.left.title;

      $('rightImage').src = state.right.imageUrl;
      $('rightImage').alt = state.right.title;
      $('rightTitle').textContent = state.right.title;
    }

    function choose(winner) {
      const loser = winner.id === state.left.id ? state.right : state.left;
      if (state.roundSize === 2) state.finalLoser = loser;
      if (state.roundSize === 4) state.semifinalLosers.push(loser);

      state.nextRoundItems.push(winner);
      state.matchIndex += 1;
      renderNextPlayableMatch();
    }

    function finishRound() {
      if (state.nextRoundItems.length === 1) {
        showWinner(state.nextRoundItems[0]);
        return;
      }

      state.roundSize = state.nextRoundItems.length;
      state.currentMatches = buildRoundMatches(state.nextRoundItems, state.roundSize);
      state.nextRoundItems = [];
      state.matchIndex = 0;
      renderNextPlayableMatch();
    }

    function showWinner(winner) {
      state.winner = winner;
      $('arena').style.display = 'none';
      $('roundLabel').textContent = '완료';
      $('matchLabel').textContent = '원픽';
      $('winnerImage').src = winner.imageUrl;
      $('winnerImage').alt = winner.title;
      $('winnerTitle').textContent = winner.title;
      renderRanking();
      $('result').style.display = 'block';
    }

    function renderRanking() {
      const ranks = [
        { rank: 1, medal: '왕관', item: state.winner, className: 'winner' },
        { rank: 2, medal: '골드', item: state.finalLoser },
        { rank: 3, medal: '실버', item: state.semifinalLosers[0] },
        { rank: 4, medal: '브론즈', item: state.semifinalLosers[1] }
      ].filter((entry) => entry.item);

      $('rankingList').innerHTML = ranks.map((entry) => `
        <article class="rank-card ${entry.className || ''}">
          <img src="${escapeHtml(entry.item.imageUrl)}" alt="${escapeHtml(entry.item.title)}">
          <div class="rank-body">
            <span class="rank-medal">${entry.rank}위 · ${entry.medal}</span>
            <strong>${escapeHtml(entry.item.title)}</strong>
          </div>
        </article>
      `).join('');
    }

    function getResultUrl() {
      const url = new URL(window.location.href);
      if (state.winner?.id) url.searchParams.set('winner', state.winner.id);
      return url.href;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function copyResultLink() {
      const lines = [
        `창섭 님의 오늘의 원픽`,
        `1위 왕관: ${state.winner?.title || ''}`,
        state.finalLoser ? `2위 골드: ${state.finalLoser.title}` : '',
        state.semifinalLosers[0] ? `3위 실버: ${state.semifinalLosers[0].title}` : '',
        state.semifinalLosers[1] ? `4위 브론즈: ${state.semifinalLosers[1].title}` : '',
        getResultUrl()
      ].filter(Boolean);

      try {
        await navigator.clipboard.writeText(lines.join('\n'));
        $('copyResultBtn').textContent = '복사 완료';
        setTimeout(() => $('copyResultBtn').textContent = '결과 링크 복사', 1500);
      } catch {
        window.prompt('아래 결과 링크를 복사하세요.', lines.join('\n'));
      }
    }

    $('leftCard').addEventListener('click', () => choose(state.left));
    $('rightCard').addEventListener('click', () => choose(state.right));
    $('restartBtn').addEventListener('click', startGame);
    $('shuffleBtn').addEventListener('click', startGame);
    $('startBtn').addEventListener('click', startGame);
    $('copyResultBtn').addEventListener('click', copyResultLink);

    loadItems()
      .then(() => {
        $('arena').style.display = 'none';
        $('result').style.display = 'none';
        $('emptyMessage').style.display = state.sourceItems.length >= 2 ? 'none' : 'block';
        $('startPanel').style.display = state.sourceItems.length >= 2 ? 'grid' : 'none';
        $('roundLabel').textContent = state.sourceItems.length >= 2 ? `${getBracketSize(state.sourceItems.length)}강` : '대기';
        $('matchLabel').textContent = `${state.sourceItems.length}장`;
      })
      .catch(() => {
        $('arena').style.display = 'none';
        $('startPanel').style.display = 'none';
        $('emptyMessage').style.display = 'block';
        $('roundLabel').textContent = '오류';
        $('matchLabel').textContent = '확인 필요';
      });
  </script>
</body>
</html>
