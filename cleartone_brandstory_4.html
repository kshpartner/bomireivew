<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>ClearTone Clean YouTube Embed - Edge Removed</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #f7f4ec;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    .video-section {
      width: 100%;
      padding: 0;
      margin: 0;
    }

    /*
      가장자리 선/여백 제거 버전
      - max-width 제거
      - border-radius 제거
      - inset shadow 제거
      - iframe을 2px 크게 키워서 YouTube iframe 가장자리 틈을 덮음
    */
    .video-frame {
      position: relative;
      width: 100%;
      max-width: none;
      margin: 0;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 0;
      background: transparent;
      isolation: isolate;
    }

    #player {
      position: absolute;
      top: -2px;
      left: -2px;
      width: calc(100% + 4px);
      height: calc(100% + 4px);
      border: 0;
      pointer-events: none;
    }

    .tap-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      cursor: pointer;
      background: transparent;
    }

    .custom-controls {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity .22s ease, transform .22s ease;
    }

    .video-frame:hover .custom-controls,
    .video-frame.controls-visible .custom-controls,
    .video-frame:focus-within .custom-controls {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .control-btn {
      flex: 0 0 auto;
      border: 0;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border-radius: 999px;
      min-width: 38px;
      height: 34px;
      padding: 0 10px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
    }

    .control-btn:hover {
      background: rgba(255,255,255,0.22);
    }

    .time {
      flex: 0 0 auto;
      min-width: 82px;
      color: rgba(255,255,255,0.88);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      white-space: nowrap;
    }

    .progress {
      flex: 1 1 auto;
      width: 100%;
      height: 5px;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 999px;
      outline: none;
      background: linear-gradient(to right, #fff 0%, #fff 0%, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0.26) 100%);
      cursor: pointer;
    }

    .progress::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .progress::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .local-notice {
      display: none;
      max-width: 1100px;
      margin: 14px auto 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(0,0,0,0.06);
      color: #333;
      font-size: 14px;
      line-height: 1.5;
    }

    body.is-local .local-notice {
      display: block;
    }

    @media (max-width: 768px) {
      .custom-controls {
        left: 10px;
        right: 10px;
        bottom: 10px;
        gap: 7px;
        padding: 8px 9px;
      }

      .control-btn {
        min-width: 34px;
        height: 31px;
        padding: 0 8px;
        font-size: 13px;
      }

      .time {
        min-width: 68px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>

  <section class="video-section">
    <div class="video-frame" id="videoFrame">
      <div id="player"></div>
      <div class="tap-layer" id="tapLayer" aria-label="재생 또는 일시정지"></div>

      <div class="custom-controls" id="customControls">
        <button class="control-btn" id="playToggle" type="button" aria-label="일시정지">⏸</button>
        <input class="progress" id="progress" type="range" min="0" max="1000" value="0" aria-label="재생 위치">
        <div class="time"><span id="currentTime">0:00</span> / <span id="duration">0:00</span></div>
        <button class="control-btn" id="soundToggle" type="button" aria-label="소리 켜기">🔇</button>
      </div>
    </div>

    <div class="local-notice">
      이 파일을 PC에서 바로 열면 YouTube Error 153이 날 수 있습니다.
      GitHub Pages, Cloudflare Pages, 카페24/자사몰 HTML 영역처럼 https 주소에서 열어야 정상 재생됩니다.
    </div>
  </section>

  <script>
    var player;
    var videoId = "5qtwPAywWcQ";
    var progressTimer = null;
    var isSeeking = false;
    var hideControlsTimer = null;

    var videoFrame = document.getElementById("videoFrame");
    var playToggle = document.getElementById("playToggle");
    var soundToggle = document.getElementById("soundToggle");
    var progress = document.getElementById("progress");
    var currentTimeEl = document.getElementById("currentTime");
    var durationEl = document.getElementById("duration");
    var tapLayer = document.getElementById("tapLayer");
    var customControls = document.getElementById("customControls");

    if (location.protocol === "file:") {
      document.body.classList.add("is-local");
    }

    var tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName("script")[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      var originValue = "";
      if (location.origin && location.origin !== "null" && location.protocol !== "file:") {
        originValue = location.origin;
      }

      player = new YT.Player("player", {
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          mute: 1,
          loop: 1,
          playlist: videoId,
          controls: 0,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          cc_load_policy: 0,
          iv_load_policy: 3,
          disablekb: 1,
          fs: 0,
          enablejsapi: 1,
          origin: originValue
        },
        events: {
          onReady: function(event) {
            event.target.mute();
            event.target.playVideo();
            hideCaptions();
            updateDuration();
            startProgressTimer();
          },
          onStateChange: function(event) {
            hideCaptions();

            if (event.data === YT.PlayerState.PLAYING) {
              playToggle.textContent = "⏸";
              playToggle.setAttribute("aria-label", "일시정지");
              startProgressTimer();
            }

            if (event.data === YT.PlayerState.PAUSED) {
              playToggle.textContent = "▶";
              playToggle.setAttribute("aria-label", "재생");
              showControls(false);
            }

            if (event.data === YT.PlayerState.ENDED) {
              player.seekTo(0, true);
              player.playVideo();
            }
          }
        }
      });
    }

    function showControls(autoHide) {
      videoFrame.classList.add("controls-visible");

      clearTimeout(hideControlsTimer);
      if (autoHide !== false) {
        hideControlsTimer = setTimeout(function () {
          if (!isSeeking) {
            videoFrame.classList.remove("controls-visible");
          }
        }, 2500);
      }
    }

    function hideCaptions() {
      if (!player) return;
      try {
        if (typeof player.unloadModule === "function") {
          player.unloadModule("captions");
          player.unloadModule("cc");
        }
        if (typeof player.setOption === "function") {
          player.setOption("captions", "track", {});
          player.setOption("cc", "track", {});
        }
      } catch (e) {}
    }

    function formatTime(seconds) {
      seconds = Math.max(0, Math.floor(seconds || 0));
      var minutes = Math.floor(seconds / 60);
      var secs = seconds % 60;
      return minutes + ":" + String(secs).padStart(2, "0");
    }

    function updateDuration() {
      if (!player || typeof player.getDuration !== "function") return;
      var duration = player.getDuration();
      durationEl.textContent = formatTime(duration);
    }

    function updateProgress() {
      if (!player || isSeeking) return;

      var duration = player.getDuration ? player.getDuration() : 0;
      var current = player.getCurrentTime ? player.getCurrentTime() : 0;

      if (duration > 0) {
        var value = Math.min(1000, Math.max(0, (current / duration) * 1000));
        progress.value = value;
        var pct = value / 10;
        progress.style.background = "linear-gradient(to right, #fff 0%, #fff " + pct + "%, rgba(255,255,255,0.26) " + pct + "%, rgba(255,255,255,0.26) 100%)";
      }

      currentTimeEl.textContent = formatTime(current);
      durationEl.textContent = formatTime(duration);
    }

    function startProgressTimer() {
      if (progressTimer) return;
      progressTimer = setInterval(updateProgress, 400);
    }

    function togglePlay() {
      if (!player || typeof player.getPlayerState !== "function") return;

      var state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
      showControls(true);
    }

    videoFrame.addEventListener("mousemove", function () {
      showControls(true);
    });

    videoFrame.addEventListener("touchstart", function () {
      showControls(true);
    }, { passive: true });

    customControls.addEventListener("mouseenter", function () {
      showControls(false);
    });

    customControls.addEventListener("mouseleave", function () {
      showControls(true);
    });

    playToggle.addEventListener("click", function (e) {
      e.stopPropagation();
      togglePlay();
    });

    tapLayer.addEventListener("click", function () {
      togglePlay();
    });

    soundToggle.addEventListener("click", function (e) {
      e.stopPropagation();
      if (!player || typeof player.isMuted !== "function") return;

      if (player.isMuted()) {
        player.unMute();
        player.setVolume(80);
        soundToggle.textContent = "🔊";
        soundToggle.setAttribute("aria-label", "소리 끄기");
      } else {
        player.mute();
        soundToggle.textContent = "🔇";
        soundToggle.setAttribute("aria-label", "소리 켜기");
      }
      showControls(true);
    });

    progress.addEventListener("input", function () {
      isSeeking = true;
      showControls(false);
      var duration = player && player.getDuration ? player.getDuration() : 0;
      var seekTo = duration * (Number(progress.value) / 1000);
      currentTimeEl.textContent = formatTime(seekTo);
      var pct = Number(progress.value) / 10;
      progress.style.background = "linear-gradient(to right, #fff 0%, #fff " + pct + "%, rgba(255,255,255,0.26) " + pct + "%, rgba(255,255,255,0.26) 100%)";
    });

    progress.addEventListener("change", function () {
      if (!player || typeof player.seekTo !== "function") return;
      var duration = player.getDuration();
      var seekTo = duration * (Number(progress.value) / 1000);
      player.seekTo(seekTo, true);
      isSeeking = false;
      hideCaptions();
      showControls(true);
    });
  </script>

</body>
</html>
